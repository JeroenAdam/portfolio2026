<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeroen Adam | IT Generalist, Web Developer</title>
  <meta name="description" content="Personal portfolio of Jeroen Adam: IT generalist, web developer, author of Talim.app." />

  <!-- Apply saved / preferred theme before first paint (no flash) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    })();
  </script>

  <!-- Fonts: classic business pairing (serif headings + humanist sans body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />

  <!-- Icons -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <!-- Script CDNs: warm up DNS+TLS before the body scripts are parsed -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

  <!-- LCP: hero image is rendered by React, so fetch it during HTML parse -->
  <link rel="preload" as="image" href="/images/hero-img.avif" fetchpriority="high" />

  <style>
    /* ============================= theme ============================= */
    :root {
      --navy: #1d3557;
      --navy-dark: #16283f;
      --blue: #2a6fb0;
      --blue-dark: #1f5890;
      --accent: #c8a951;
      --ink: #2b2f36;
      --muted: #64748b;
      --heading: #1d3557;
      --surface: #ffffff;
      --bg: #ffffff;
      --bg-alt: #f3f5f8;
      --line: #dde3ea;
      --btn: #2a6fb0;
      --btn-hover: #1f5890;
      --card-shadow: 0 2px 10px rgba(23, 43, 77, 0.08);
      --radius: 6px;
      --font-head: "Source Sans 3", "Segoe UI", Arial, sans-serif;
      --font-body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
    }
    /* dark mode: same layout, darker surfaces. --navy / --navy-dark stay dark:
       they are used as chrome (header, hero, footer, captions). */
    html.dark {
      --blue: #6ea9de;
      --blue-dark: #92c1e8;
      --ink: #c6cfdb;
      --muted: #92a0b2;
      --heading: #d9e2ee;
      --surface: #1a232e;
      --bg: #111821;
      --bg-alt: #17202a;
      --line: #2b3745;
      --btn: #2d5f8d;
      --btn-hover: #3a74a9;
      --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; overflow-anchor: none; }
    body { font-family: var(--font-body); color: var(--ink); background: var(--bg); line-height: 1.65; transition: background-color 0.25s, color 0.25s; }
    img { max-width: 100%; height: auto; }
    a { color: var(--blue); text-decoration: none; }
    a:hover { color: var(--blue-dark); text-decoration: underline; }
    h1, h2, h3, h4 { font-family: var(--font-head); color: var(--heading); line-height: 1.25; }

    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 1.25rem; }
    .section { padding: 4rem 0 3.5rem; }
    .section.alt { background-color: var(--bg-alt); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    /* Repeating tech-icon texture — the old Gatsby .bg-grey, recoloured to this
       palette (navy on light surfaces, light slate on dark). Applied as a
       background-image so it layers over whatever surface the section already has. */
    /* The ?v= query is a cache-buster (_headers caches /svg/* for 30 days): bump it
       whenever a pattern file changes, the same way the old ?background.svg?x53054 did. */
    .bg-pattern { background-image: url("/svg/pattern-light.svg?v=2"); background-position: 50% 50%; background-repeat: repeat; background-size: 50px; }
    html.dark .bg-pattern { background-image: url("/svg/pattern-dark.svg?v=2"); }

    .section-title { text-align: center; margin-bottom: 2.5rem; }
    .section-title h2 { font-size: 1.9rem; text-transform: uppercase; letter-spacing: 2px; display: inline-block; }
    .section-title .rule { width: 90px; height: 3px; background: var(--accent); margin: 0.8rem auto 0; }

    .btn {
      display: inline-block; background: var(--btn); color: #fff; border: 0; cursor: pointer;
      padding: 0.65rem 1.6rem; font: 600 0.95rem var(--font-body); letter-spacing: 0.5px;
      text-transform: uppercase; border-radius: var(--radius); transition: background 0.15s;
    }
    .btn:hover { background: var(--btn-hover); color: #fff; text-decoration: none; }
    .btn.center { display: block; margin: 2rem auto 0; width: max-content; }
    .btn.ghost { background: transparent; border: 2px solid #fff; }
    .btn.ghost:hover { background: rgba(255, 255, 255, 0.12); }

    /* ============================= header ============================= */
    .site-header { position: sticky; top: 0; z-index: 900; background: var(--navy); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25); }
    /* header content is full screen width (no 1100px wrap), generous edge padding */
    .header-inner { display: flex; align-items: center; justify-content: space-between; min-height: 72px; gap: 1rem; padding: 0 clamp(1.25rem, 3vw, 2.5rem); }
    .brand { color: #fff; display: flex; flex-direction: column; line-height: 1.15; }
    .brand strong { font-family: var(--font-head); font-size: clamp(1.05rem, 1.6vw, 1.35rem); letter-spacing: 1px; }
    .brand small { color: var(--accent); font-size: clamp(0.58rem, 0.9vw, 0.72rem); text-transform: uppercase; letter-spacing: 2px; }
    .brand:hover { color: #fff; text-decoration: none; }

    /* labels scale down with the viewport instead of wrapping; hamburger takes over at 900px */
    .main-nav ul { list-style: none; display: flex; gap: 0.375rem; }
    .main-nav a {
      display: flex; align-items: center; gap: clamp(0.3rem, 0.7vw, 0.55rem); color: #dbe4ee; font-weight: 600;
      font-size: clamp(0.9rem, 1.2vw, 1.1rem); text-transform: capitalize; white-space: nowrap;
      padding: 0.65rem clamp(0.4rem, 0.9vw, 0.85rem); border-bottom: 3px solid transparent;
    }
    .main-nav a:hover { color: #fff; background: rgba(255, 255, 255, 0.06); text-decoration: none; }
    .main-nav a.active { color: #fff; border-bottom-color: var(--accent); }

    .menu-toggle { display: none; background: none; border: 1px solid rgba(255, 255, 255, 0.4); color: #fff; font-size: 1.15rem; padding: 0.4rem 0.75rem; border-radius: var(--radius); cursor: pointer; }
    .header-actions { display: flex; align-items: center; gap: 0.5rem; }
    .theme-toggle { background: none; border: 1px solid rgba(255, 255, 255, 0.4); color: #fff; font-size: 1.05rem; padding: 0.45rem 0.7rem; border-radius: var(--radius); cursor: pointer; transition: color 0.15s, border-color 0.15s; }

    @media (max-width: 900px) {
      .menu-toggle { display: block; }
      .main-nav { display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--navy-dark); box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3); }
      .main-nav.open { display: block; }
      .main-nav ul { flex-direction: column; padding: 0.5rem 0; }
      .main-nav a { padding: 1rem 1.5rem; font-size: 1.15rem; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
      .main-nav a.active { border-bottom-color: rgba(255, 255, 255, 0.06); background: rgba(255, 255, 255, 0.05); }
    }

    /* ============================= hero ============================= */
    .hero { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 60%, #0f1d30 100%); color: #fff; padding: 7.5rem 0; }
    .hero-inner { display: flex; align-items: center; gap: 3.5rem; }
    .hero-info { flex: 1 1 auto; }
    .hero-info .arabic { font-size: 1.15rem; color: var(--accent); letter-spacing: 1px; }
    .hero-info h1 { color: #fff; font-size: 3rem; margin: 0.35rem 0 1rem; }
    .hero-info .rule { width: 120px; height: 3px; background: var(--accent); margin-bottom: 1.2rem; }
    .hero-info h2 { color: #fff; font-size: 1.7rem; margin-bottom: 0.6rem; }
    .hero-info h4 { color: #cfdae7; font-family: var(--font-body); font-weight: 600; font-size: 1.1rem; }
    .hero-info h4 a { color: var(--accent); }
    .hero-info h5 { color: #9fb2c8; font-weight: 400; font-style: italic; font-size: 1rem; margin-bottom: 1.6rem; }
    .hero-img-wrap { flex: 0 0 304px; }
    .hero-img-wrap img { border-radius: var(--radius); }
    .hero .social-links { margin-top: 1.6rem; }
    @media (max-width: 800px) {
      .hero-inner { flex-direction: column-reverse; text-align: center; }
      .hero-info .rule { margin-left: auto; margin-right: auto; }
      .hero-img-wrap { flex-basis: auto; width: 192px; }
      .hero .social-links { justify-content: center; }
    }

    .social-links { list-style: none; display: flex; gap: 0.85rem; }
    .social-links a {
      width: 42px; height: 42px; background: transparent; border: none; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center; color: var(--heading); font-size: 1.2rem; transition: color 0.15s;
    }
    .hero .social-links a { color: #fff; }

    /* ============================= services ============================= */
    .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    @media (max-width: 900px) { .services-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .services-grid { grid-template-columns: 1fr; } }
    .service-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.6rem 1.4rem; box-shadow: var(--card-shadow); }
    .service-card i { font-size: 1.7rem; color: var(--blue); }
    .service-card h4 { margin: 0.7rem 0 0.4rem; font-size: 1rem; letter-spacing: 1px; text-transform: uppercase; font-family: var(--font-body); }
    .service-card p { color: var(--muted); font-size: 0.95rem; }

    /* ============================= jobs / experience ============================= */
    .jobs-tabs { display: flex; justify-content: center; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 2rem; }
    .job-tab {
      background: var(--surface); border: 1px solid var(--line); color: var(--heading); font: 600 0.95rem var(--font-body);
      padding: 0.55rem 1.4rem; border-radius: var(--radius); cursor: pointer; transition: all 0.15s;
    }
    .job-tab:hover { border-color: var(--blue); color: var(--blue); }
    .job-tab.active { background: var(--btn); border-color: var(--btn); color: #fff; }
    /* all panels stacked in one grid cell: container is always as tall as the
       tallest panel, so switching tabs never changes the section height */
    .job-panels { display: grid; }
    .job-panels .job-panel { grid-area: 1 / 1; }
    .job-panel { width: 100%; max-width: 710px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 2rem 2.2rem; box-shadow: var(--card-shadow); transition: opacity 0.15s; }
    .job-panel.hidden { visibility: hidden; opacity: 0; pointer-events: none; }
    .job-panel h3 { font-size: 1.4rem; }
    .job-panel h3 .side-note { font-weight: 400; }
    .job-panel .company { color: var(--blue); font-weight: 700; font-size: 1.05rem; }
    .job-panel .date { color: var(--muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; margin: 0.2rem 0 1.1rem; }
    .job-panel ul { list-style: none; }
    .job-panel li { padding: 0.35rem 0 0.35rem 1.6rem; position: relative; }
    .job-panel li::before { content: "\00bb"; position: absolute; left: 0.2rem; color: var(--accent); font-weight: 700; }

    /* ============================= projects ============================= */
    .project { display: flex; gap: 2.5rem; align-items: center; margin-bottom: 3.5rem; scroll-margin-top: 90px; }
    /* alternation must use nth-of-type: the section title is a div, the cards are
       articles, so nth-child and nth-of-type disagree (mobile reset must match) */
    .project:nth-of-type(even) { flex-direction: row-reverse; }
    .project-photo { flex: 1 1 52%; position: relative; }
    .project-photo img { border-radius: var(--radius); box-shadow: var(--card-shadow); border: 1px solid var(--line); }
    .project-photo a { display: block; cursor: zoom-in; position: relative; }
    .photo-zoom {
      position: absolute; right: 0.8rem; bottom: 0.8rem; width: 40px; height: 40px; border-radius: var(--radius);
      background: rgba(29, 53, 87, 0.75); color: #fff; display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.05rem; opacity: 0; transition: opacity 0.15s; pointer-events: none;
    }
    .project-photo a:hover .photo-zoom, .project-photo a:focus-visible .photo-zoom { opacity: 1; }
    .project-info { flex: 1 1 42%; }
    .project-info h3 { font-size: 1.45rem; margin-bottom: 0.25rem; }
    .project-info .status { color: var(--blue); font-weight: 600; font-size: 0.92rem; margin-bottom: 0.9rem; }
    .project-desc { color: var(--muted); font-size: 0.97rem; }
    .project-desc p { margin-bottom: 0.5rem; }
    .stack-label { font-weight: 700; color: var(--heading); margin: 0.9rem 0 0.45rem; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
    .stack { display: flex; flex-wrap: wrap; gap: 0.45rem; }
    .stack span { background: var(--bg-alt); border: 1px solid var(--line); color: var(--heading); font-size: 0.8rem; font-weight: 600; padding: 0.22rem 0.7rem; border-radius: 20px; }
    .project-links { margin-top: 1rem; display: flex; align-items: center; gap: 1rem; }
    .project-links a { font-weight: 700; font-size: 0.92rem; text-transform: uppercase; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 0.4rem; }
    .project-links a i { font-size: 1.1rem; }
    @media (max-width: 800px) {
      .project, .project:nth-of-type(even) { flex-direction: column; }
      .project-photo, .project-info { flex: 1 1 auto; width: 100%; }
    }

    /* ============================= blogs ============================= */
    .blogs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    @media (max-width: 900px) { .blogs-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .blogs-grid { grid-template-columns: 1fr; } }
    .blog-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--card-shadow); color: inherit; display: flex; flex-direction: column; scroll-margin-top: 90px; }
    .blog-card:hover { text-decoration: none; box-shadow: 0 6px 18px rgba(23, 43, 77, 0.16); transform: translateY(-2px); transition: all 0.15s; }
    /* same proportions as the old Gatsby cards: 368px wide x 15rem (240px) tall */
    .blog-card .cover { aspect-ratio: 368 / 240; background: var(--navy); overflow: hidden; }
    .blog-card .cover img { width: 100%; height: 100%; object-fit: cover; }
    .blog-card .body { padding: 1.1rem 1.2rem 1.2rem; display: flex; flex-direction: column; flex: 1; }
    .blog-card h4 { color: var(--heading); font-size: 1.05rem; margin-bottom: 0.4rem; }
    .blog-card .excerpt { color: var(--muted); font-size: 0.92rem; flex: 1; }
    .blog-card .meta { display: flex; justify-content: space-between; margin-top: 0.9rem; padding-top: 0.7rem; border-top: 1px solid var(--line); font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .blog-card .meta .cat { color: var(--blue); font-weight: 700; }

    /* ============================= blog article ============================= */
    .article { max-width: 820px; margin: 0 auto; }
    .article h1 { font-size: 2rem; margin-bottom: 0.4rem; }
    .article .date { color: var(--muted); font-size: 0.9rem; letter-spacing: 1px; margin-bottom: 1.8rem; }
    .article .date i { color: var(--accent); }
    .prose p { margin-bottom: 1rem; }
    .prose h1, .prose h2, .prose h3 { margin: 1.6rem 0 0.7rem; }
    .prose ul, .prose ol { margin: 0 0 1rem 1.5rem; }
    .prose img { display: block; margin: 1.2rem auto; border-radius: var(--radius); border: 1px solid var(--line); box-shadow: var(--card-shadow); }
    .prose blockquote { border-left: 4px solid var(--accent); padding: 0.3rem 1.2rem; color: var(--muted); background: var(--bg-alt); margin-bottom: 1rem; }
    .prose video { display: block; margin: 1.2rem auto; max-width: 100%; }

    /* ============================= lightbox (in content) ============================= */
    .lightbox { display: none; position: fixed; z-index: 999; inset: 0; padding: 1em; background: rgba(0, 0, 0, 0.85); }
    .lightbox:target { display: block; }
    /* JS-managed lightboxes (myboat): opening/closing must not touch the
       navigation history, so :target is neutralized and .open drives display */
    .lightbox.js-lb:target { display: none; }
    .lightbox.js-lb.open { display: block; }
    .lightbox > a { cursor: zoom-out; }
    .lightbox span { display: block; width: 100%; height: 100%; background-position: center; background-repeat: no-repeat; background-size: contain; }

    /* ============================= voyages ============================= */
    .voyage-intro { max-width: 800px; margin: 0 auto 2rem; text-align: center; color: var(--muted); }
    .carousel { max-width: 960px; margin: 0 auto; position: relative; }
    .carousel-frame { background: #000; border-radius: var(--radius); overflow: hidden; box-shadow: 0 10px 30px rgba(23, 43, 77, 0.25); }
    .carousel-frame img { width: 100%; height: 540px; object-fit: cover; display: block; }
    .carousel-caption { background: var(--navy); color: #fff; text-align: center; padding: 0.9rem 3rem; font-family: var(--font-head); font-size: 1.05rem; }
    .carousel-btn { position: absolute; top: 42%; transform: translateY(-50%); background: rgba(255, 255, 255, 0.88); border: 0; color: #1d3557; width: 42px; height: 42px; border-radius: var(--radius); font-size: 1.1rem; cursor: pointer; }
    .carousel-btn:hover { background: var(--accent); }
    .carousel-btn.prev { left: 12px; }
    .carousel-btn.next { right: 12px; }
    .carousel-dots { text-align: center; margin-top: 1rem; }
    .carousel-dots button { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--blue); background: transparent; margin: 0 4px; padding: 0; cursor: pointer; }
    .carousel-dots button.active { background: var(--blue); }
    @media (max-width: 700px) { .carousel-frame img { height: 260px; } }

    /* ============================= about / myboat ============================= */
    .split { display: flex; gap: 3rem; align-items: flex-start; }
    .split .photo { flex: 0 0 260px; }
    .split .photo a { display: block; cursor: zoom-in; position: relative; }
    .split .photo.plain img { border: 0; box-shadow: none; }
    .split .photo img { border-radius: var(--radius); border: 1px solid var(--line); box-shadow: var(--card-shadow); }
    .split .content { flex: 1; }
    .split .content .title-row { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1rem; }
    .split .content .title-row h2 { font-size: 1.8rem; }
    .stack.about-stack { margin-top: 0.8rem; }
    .toolset { margin-top: 1.4rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-alt); padding: 0.9rem 1.1rem; }
    .toolset summary { cursor: pointer; font-weight: 700; color: var(--heading); }
    .toolset summary .hint { font-weight: 400; }
    .toolset .tools { margin-top: 0.8rem; font-size: 0.92rem; color: var(--muted); }
    .toolset .tools img { height: 22px; vertical-align: -5px; margin: 0 3px 0 10px; }
    /* the tool SVGs are plain black; brighten them like text in dark mode */
    html.dark .toolset .tools img { filter: invert(80%); }
    .sideprojects { margin-top: 1.4rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 0.9rem 1.1rem; }
    .sideprojects summary { cursor: pointer; font-weight: 700; color: var(--heading); }
    .toolset summary i, .sideprojects summary i { margin-right: 0.45rem; }
    .sideprojects .items { margin-top: 0.7rem; font-size: 0.95rem; }
    .sideprojects .items p { margin-bottom: 0.6rem; }
    @media (max-width: 750px) { .split { flex-direction: column; } .split .photo { flex-basis: auto; } }

    .specs { margin: 1rem 0 1rem 1.3rem; }
    .specs li { margin-bottom: 0.35rem; }

    /* ============================= contact ============================= */
    .contact-box { max-width: 640px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--card-shadow); padding: 2.4rem; }
    .contact-box h3 { font-size: 1.5rem; margin-bottom: 0.5rem; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
    .contact-box .lead { text-align: center; color: var(--muted); margin-bottom: 1.6rem; }
    .form-group { display: grid; gap: 1rem; margin-bottom: 1.2rem; }
    .form-control { width: 100%; border: 1px solid var(--line); border-radius: var(--radius); padding: 0.7rem 0.9rem; font: 400 1rem var(--font-body); background: var(--bg-alt); color: var(--ink); }
    .form-control:focus { outline: 2px solid var(--blue); border-color: var(--blue); background: var(--surface); }
    .form-control::placeholder { color: var(--muted); }
    textarea.form-control { resize: vertical; }

    /* ============================= scroll to top ============================= */
    .scroll-to-top {
      position: fixed; bottom: 2vh; right: 2vw; z-index: 850;
      width: 2.6rem; height: 2.6rem; border: 0; border-radius: 9999px;
      background: var(--navy); color: #fff; cursor: pointer; box-shadow: var(--card-shadow);
      opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.15s ease;
    }
    .scroll-to-top.is-visible { opacity: 0.8; visibility: visible; pointer-events: auto; }
    .scroll-to-top.is-visible:hover { opacity: 1; background: var(--blue); }
    @media (max-width: 767.98px) { .scroll-to-top { display: none; } }

    /* ============================= footer / misc ============================= */
    .site-footer { background: var(--navy-dark); color: #cfdae7; padding: 1rem 0; text-align: center; }
    .site-footer h4 { color: #fff; font-family: var(--font-body); text-transform: uppercase; letter-spacing: 2px; font-size: 0.95rem; margin-bottom: 1rem; }
    .site-footer .social-links { justify-content: center; }
    .site-footer .social-links a { color: #fff; }
    /* combined hover: declared after every hero + footer base rule, and with the
       highest specificity, so on hover only the icon color changes — no fill,
       and no underline from the global "a:hover" rule */
    .social-links a:hover, .hero .social-links a:hover, .site-footer .social-links a:hover {
      color: rgba(255, 255, 255, 0.65); text-decoration: none;
    }

    .loading, .not-found, .fatal { text-align: center; padding: 6rem 1rem; color: var(--muted); }
    .loading i { font-size: 2.4rem; color: var(--blue); }
    .fatal code { background: var(--bg-alt); padding: 0.15rem 0.45rem; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React 18 + Babel (single-file setup, no build step) -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <!-- Markdown renderer for blog content -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    /* ------------------------------------------------------------------
      Routing: canonical PATH URLs — adambahri.com/blogs/foo — exactly as
      the old Gatsby site had them (Google indexed those). Internal links
      keep navigating via hash ("#/route" + optional "#frag") and every
      route change normalizes the URL to its clean path form. Legacy
      "/#/route" URLs keep working and get normalized to "/route".
      Netlify's _redirects serves index.html for every path, so any URL
      can be a direct entry point (locally serve.py does the same).
    ------------------------------------------------------------------ */
    function parseHash() {
      const raw = window.location.hash.replace(/^#/, "");
      if (raw.startsWith("/")) {
        // legacy hash route: "#/route" + optional "#frag"
        const [path, frag] = raw.split("#");
        return { path, frag: frag || null };
      }
      // path form: "/blogs/foo" + optional "#frag" anchor
      const path = window.location.pathname.replace(/\/+$/, "") || "/";
      return { path, frag: raw || null };
    }
    function useHashRoute() {
      const [route, setRoute] = useState(parseHash());
      useEffect(() => {
        const onChange = () => setRoute(prev => {
          const next = parseHash();
          if (window.location.hash.replace(/^#/, "").split("#")[0].startsWith("/")) return next;
          if (next.path !== prev.path) return next; // path-form change (also fires on back)
          return prev; // in-page anchor / lightbox: keep current page, native scroll handles it
        });
        const onPop = () => {
          // browser back/forward between path URLs fires no hashchange at all:
          // the route must be re-read here. For hash navigations this also fires
          // (before hashchange), which then re-decides intent — so a clicked
          // hash nav still counts as intentional.
          lastChangeIntentional = false;
          setRoute(parseHash());
        };
        window.addEventListener("hashchange", onChange);
        window.addEventListener("popstate", onPop);
        return () => { window.removeEventListener("hashchange", onChange); window.removeEventListener("popstate", onPop); };
      }, []);
      return route;
    }
    // Assets are hosted at the site root. With a path-form route in the address
    // bar (/blogs/foo), relative references would resolve against /blogs/, so
    // every data-driven asset path is rooted here.
    const abs = u => (u && !/^(https?:)?\/\//.test(u) && !u.startsWith("/") ? "/" + u : u);
    const absHtml = h => (h || "")
      .replace(/src="(images\/|svg\/)/g, 'src="/$1')
      .replace(/src='(images\/|svg\/)/g, "src='/$1")
      .replace(/url\('(images\/|svg\/)/g, "url('/$1")
      .replace(/url\("(images\/|svg\/)/g, 'url("/$1')
      .replace(/url\((images\/|svg\/)/g, "url(/$1");
    function scrollToTarget(frag) {
      if (frag) {
        const el = document.getElementById(frag);
        if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
      }
      window.scrollTo({ top: 0 });
    }
    // images further up the page may still load after the restore, growing the
    // page height and clamping the scroll: re-apply until the position sticks
    function restoreScroll(y) {
      const apply = () => window.scrollTo({ top: y, behavior: "instant" });
      apply();
      let tries = 0;
      const id = setInterval(() => {
        if (Math.abs(window.scrollY - y) < 2 || ++tries > 20) clearInterval(id);
        else apply();
      }, 50);
    }
    // Markdown renders raw anchors; intercept any root-relative "/..." link
    function onContentClick(e) {
      const a = e.target.closest("a");
      if (!a) return;
      const href = a.getAttribute("href");
      if (href && href.startsWith("/") && !href.startsWith("//")) {
        e.preventDefault();
        markForwardIntent();
        window.location.hash = "#" + href;
      }
    }
    // Special cases: links in the Experience section that lead to a blog article
    // (MLOps) or to the myboat page (sailboat), and the blog cards of the home
    // page's "My latest articles". The target is remembered, so the "go back"
    // button there uses browser history and the user lands exactly where they
    // were (same page, same scroll, same experience tab).
    // Chrome fires popstate on EVERY hash navigation (forward clicks included)
    // and asynchronously restores scroll on its own, racing the app. So: clicks
    // mark an intent; the hashchange handler decides whether that change was
    // clicked (reset) or came from browser history (restore); and scroll
    // restoration is switched to manual so scrolling is fully app-controlled.
    let forwardIntent = false, lastChangeIntentional = true;
    const markForwardIntent = () => { forwardIntent = true; };
    document.addEventListener("click", e => {
      if (e.target && e.target.closest && e.target.closest('a[href^="#"]')) markForwardIntent();
    });
    window.addEventListener("hashchange", () => {
      lastChangeIntentional = forwardIntent;
      forwardIntent = false;
    });
    const isHistoryNav = () => !lastChangeIntentional;
    try { history.scrollRestoration = "manual"; } catch (e) {}
    function markReturnNav(e) {
      const a = e.target.closest("a");
      if (!a) return;
      let href = a.getAttribute("href") || "";
      if (href.startsWith("/")) href = "#" + href;
      if (href.startsWith("#/blogs/") || href === "#/myboat" || href === "#/skillmatrix" || href === "#/bookkeeping-app") {
        try {
          sessionStorage.setItem("backViaHistory", href.slice(1));
          sessionStorage.setItem("backScroll", String(Math.round(window.scrollY)));
        } catch (err) {}
      }
    }
    function isBackViaHistory(path) {
      try { return sessionStorage.getItem("backViaHistory") === path; } catch (e) { return false; }
    }

    /* ------------------------------------------------ Markdown helper --- */
    function Md({ text, className }) {
      const html = marked.parse(text || "", { gfm: true });
      return <div className={className} dangerouslySetInnerHTML={{ __html: absHtml(html) }} onClick={onContentClick} />;
    }
    function Html({ html, className }) {
      return <div className={className} dangerouslySetInnerHTML={{ __html: absHtml(html) }} onClick={onContentClick} />;
    }

    /* ------------------------------------------------------- primitives - */
    function SectionTitle({ title }) {
      return <div className="section-title"><h2>{title}</h2><div className="rule" /></div>;
    }
    function SocialLinks({ items, extraClass }) {
      return (
        <ul className={"social-links " + (extraClass || "")}>
          {items.map(s => (
            <li key={s.id}>
              <a href={s.url} target="_blank" rel="noopener noreferrer" aria-label={s.label} title={s.label}>
                <i className={s.icon}></i>
              </a>
            </li>
          ))}
        </ul>
      );
    }
    function StackTags({ items }) {
      // contentful stack values may arrive as one string "A - B - C" or a list
      const tags = (items || []).flatMap(s => String(s).split(/\s+-\s+/)).filter(Boolean);
      return (
        <div className="stack">{tags.map((t, i) => <span key={i}>{t.trim()}</span>)}</div>
      );
    }

    /* ---------------------------------------------------- scroll-to-top -- */
    /* Ported from talim2026 (features/search/ScrollToTopButton.tsx): visibility
       is toggled on the DOM node (no setState) so scrolling never re-renders. */
    const SHOW_AFTER_Y = 400;
    function ScrollToTopButton() {
      const buttonRef = useRef(null);
      const pressedRef = useRef(false);
      useEffect(() => {
        const syncVisibility = () => {
          const btn = buttonRef.current;
          if (!btn) return;
          const shouldShow = window.scrollY > SHOW_AFTER_Y;
          btn.classList.toggle("is-visible", shouldShow);
          btn.setAttribute("aria-hidden", shouldShow ? "false" : "true");
          btn.tabIndex = shouldShow ? 0 : -1;
        };
        document.addEventListener("scroll", syncVisibility, { passive: true, capture: true });
        syncVisibility();
        return () => document.removeEventListener("scroll", syncVisibility, true);
      }, []);
      const scrollToTop = () => window.scrollTo({ top: 0, behavior: "smooth" });
      return (
        <button
          ref={buttonRef}
          type="button"
          className="scroll-to-top"
          aria-label="Scroll to top"
          aria-hidden="true"
          tabIndex={-1}
          onPointerDown={e => {
            if (!buttonRef.current?.classList.contains("is-visible")) return;
            if (e.isPrimary && (e.pointerType === "mouse" ? e.button === 0 : true)) {
              pressedRef.current = true;
            }
          }}
          onPointerCancel={() => { pressedRef.current = false; }}
          onClick={e => {
            e.preventDefault();
            e.stopPropagation();
            const visible = buttonRef.current?.classList.contains("is-visible");
            if (!visible || !pressedRef.current) { pressedRef.current = false; return; }
            pressedRef.current = false;
            scrollToTop();
          }}
          onKeyDown={e => {
            if (!buttonRef.current?.classList.contains("is-visible")) return;
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              scrollToTop();
            }
          }}
        >
          <i className="fa-solid fa-chevron-up"></i>
        </button>
      );
    }

    /* ------------------------------------------------------------- bits -- */
    function BlogCard({ post, showId }) {
      return (
        <a className="blog-card" href={"#/blogs/" + post.slug} id={showId ? post.slug : undefined}>
          <div className="cover">{post.image ? <img src={abs(post.image)} alt="" loading="lazy" /> : null}</div>
          <div className="body">
            <h4>{post.title}</h4>
            <div className="excerpt">{post.desc}</div>
            <div className="meta">
              <span className="cat">{(post.category[0] || "").toUpperCase()}</span>
              <span>{post.created}</span>
            </div>
          </div>
        </a>
      );
    }

    function BlogGrid({ posts, showIds, onClick }) {
      return (
        <div className="blogs-grid" onClick={onClick}>
          {posts.map(p => <BlogCard key={p.id} post={p} showId={showIds} />)}
        </div>
      );
    }

    function ProjectCard({ project }) {
      const slug = project.title.toLowerCase().replace(/ /g, "-").replace(/\//g, "").replace(/--+/g, "-");
      const demoUrl = project.url.startsWith("../") ? "#/" + project.url.slice(3).replace(/^\//, "") : project.url;
      return (
        <article className="project" id={slug}>
          {project.image && (
            <div className="project-photo">
              <a href={"#" + slug + "-full"} aria-label={"Enlarge photo of " + project.title}>
                <img src={abs(project.image)} alt={project.title} loading="lazy" />
                <span className="photo-zoom"><i className="fa-solid fa-magnifying-glass-plus"></i></span>
              </a>
            </div>
          )}
          <div className="project-info">
            <h3>{project.title}</h3>
            <div className="status">{project.url
              ? project.status.split(/(\bdemo\b)/).map((part, i) => /^\bdemo\b$/.test(part) ? <a key={i} href={demoUrl}>{part}</a> : part)
              : project.status}</div>
            <Html className="project-desc" html={project.descriptionHtml} />
            <div className="stack-label">Tech stack</div>
            <StackTags items={project.stack} />
            <div className="project-links">
              {project.github && <a href={project.github} target="_blank" rel="noopener noreferrer"><i className="fa-brands fa-github"></i> Code</a>}
              {project.url && <a href={demoUrl}><i className="fa-solid fa-arrow-up-right-from-square"></i> Demo</a>}
            </div>
          </div>
          {project.image && (
            <div className="lightbox" id={slug + "-full"}>
              <a href={"#" + slug} aria-label="Close"><span style={{ backgroundImage: "url('" + abs(project.image) + "')" }} /></a>
            </div>
          )}
        </article>
      );
    }

    function JobsSection({ jobs }) {
      const tabSlug = c => c.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
      // the selected tab is only kept when returning (via browser history) from a
      // special-case Experience link; normal navigation resets to the first tab
      const [value, setValue] = useState(() => {
        try {
          if (!(isHistoryNav() && sessionStorage.getItem("backViaHistory"))) return 0;
          const saved = sessionStorage.getItem("jobsTab");
          const i = jobs.findIndex(j => tabSlug(j.company) === saved);
          return i >= 0 ? i : 0;
        } catch (e) { return 0; }
      });
      const select = i => setValue(i);
      // storage must mirror the tab actually shown — including when the section
      // resets to the first tab — otherwise a later history return restores a
      // stale tab (e.g. MLOps clicked on the default tab after an earlier visit
      // to another one)
      useEffect(() => {
        try { sessionStorage.setItem("jobsTab", tabSlug(jobs[value].company)); } catch (e) {}
      }, [value]);
      return (
        <section className="section alt" id="jobs">
          <div className="wrap">
            <div id="experience" />
            <SectionTitle title="experience" />
            <div className="jobs-tabs">
              {jobs.map((j, i) => (
                <button key={j.company} id={tabSlug(j.company)}
                        className={"job-tab" + (i === value ? " active" : "")} onClick={() => select(i)}>
                  {j.company}{j.duration ? " (" + j.duration + ")" : ""}
                </button>
              ))}
            </div>
            <div className="job-panels" onClick={markReturnNav}>
              {jobs.map((j, i) => (
                <div key={j.company} className={"job-panel" + (i === value ? "" : " hidden")} aria-hidden={i !== value}>
                  <h3>{j.position.split(/(\(side job\))/i).map((part, i) =>
                    /^\(side job\)$/i.test(part) ? <span key={i} className="side-note">{part}</span> : part)}</h3>
                  <div className="company">{j.company}</div>
                  <div className="date">{j.date}</div>
                  <ul>{j.desc.map((d, k) => <li key={k}><MdInline text={d} /></li>)}</ul>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }
    function MdInline({ text }) {
      return <span dangerouslySetInnerHTML={{ __html: marked.parseInline(text || "", { gfm: true }) }} onClick={onContentClick} />;
    }

    function ServicesSection({ services, children }) {
      return (
        <section className="section bg-pattern">
          <div className="wrap">
            <SectionTitle title="My skills" />
            <div className="services-grid">
              {services.map(s => (
                <article className="service-card" key={s.id}>
                  <i className={s.icon}></i>
                  <h4>{s.title}</h4>
                  <p>{s.text}</p>
                </article>
              ))}
            </div>
            {children}
          </div>
        </section>
      );
    }

    /* ---------------------------------------------------------- pages --- */
    function HomePage({ data }) {
      const featured = data.projects.filter(p => p.featured);
      const latest = data.blogs.slice(0, 6);
      return (
        <>
          <header className="hero">
            <div className="wrap hero-inner">
              <div className="hero-info">
                <div className="arabic"><h1 style={{ fontSize: "1.3rem", color: "inherit" }}>{data.profile.greetingArabic}</h1></div>
                <h1>Welcome</h1>
                <div className="rule" />
                <h2>I&apos;m {data.profile.name}</h2>
                <h4>{data.profile.headline} | {data.profile.authorOf.split(/(Talim\.app)/i).map((part, i) =>
                  /^talim\.app$/i.test(part)
                    ? <a key={i} href={data.profile.talimUrl} target="_blank" rel="noopener noreferrer">{part}</a>
                    : part)}</h4>
                <h5>{data.profile.note}</h5>
                <a href="#/projects" className="btn">my projects</a>
                <SocialLinks items={data.profile.social} />
              </div>
              <div className="hero-img-wrap">
                <img src={abs(data.profile.heroImage)} alt="Jeroen Adam"
                     onError={e => { e.currentTarget.src = data.profile.heroImageFallback; }} />
              </div>
            </div>
          </header>
          <ServicesSection services={data.services} />
          <JobsSection jobs={data.jobs} />
          <section className="section">
            <div className="wrap">
              <SectionTitle title="My projects" />
              {(featured.length ? featured : data.projects).map(p => <ProjectCard key={p.title} project={p} />)}
              <a href="#/projects" className="btn center">projects</a>
            </div>
          </section>
          <section className="section alt bg-pattern">
            <div className="wrap">
              <SectionTitle title="My latest articles" />
              <BlogGrid posts={latest} onClick={markReturnNav} />
              <a href="#/blog" className="btn center">blog</a>
            </div>
          </section>
        </>
      );
    }

    function AboutPage({ data }) {
      const { about } = data;
      // "local LLM" photo opens through a state-driven lightbox so opening and
      // closing it never touches the navigation history (same as myboat)
      const [lb, setLb] = useState(() => location.hash === "#ai-pc-2026" ? "ai-pc-2026" : null);
      const onItemsClick = e => {
        const a = e.target.closest && e.target.closest('a[href="#ai-pc-2026"]');
        if (a) { e.preventDefault(); setLb("ai-pc-2026"); }
      };
      const closeLb = e => {
        e.preventDefault();
        setLb(null);
        if (location.hash) history.replaceState(null, "", location.pathname);
      };
      return (
        <>
          <section className="section">
            <div className="wrap split">
              <div className="photo plain">
                <img src={abs(data.profile.heroImage)} alt="Jeroen Adam"
                     onError={e => { e.currentTarget.src = data.profile.heroImageFallback; }} />
              </div>
              <div className="content">
                <div className="title-row"><h2>{about.title}</h2></div>
                <Html className="prose" html={about.infoHtml} />
                <div className="stack-label">My skills</div>
                <StackTags items={about.stack} />
                <details className="toolset">
                  <summary><i className="fa-solid fa-screwdriver-wrench"></i> My current toolset <span className="hint">(click to unfold)</span></summary>
                  <div className="tools">
                    {about.toolset.map(([icon, label]) => (
                      <span key={label}><img src={abs("svg/" + icon)} alt="" /> {label}</span>
                    ))}
                  </div>
                </details>
                <details className="sideprojects" open>
                  <summary><i className="fa-solid fa-brain"></i> Side projects</summary>
                  <div className="items" onClick={onItemsClick}>{about.sideProjects.map((p, i) => <Md key={i} text={p} />)}</div>
                </details>
                <div className={"lightbox js-lb" + (lb === "ai-pc-2026" ? " open" : "")} id="ai-pc-2026">
                  <a href="#ai-pc-2026-1" onClick={closeLb}><span style={{ backgroundImage: "url('" + abs("images/ai-pc-2026.webp") + "')" }} /></a>
                </div>
              </div>
            </div>
          </section>
          <JobsSection jobs={data.jobs} />
          <ServicesSection services={data.services}>
            <a href="#/" className="btn center" style={{ marginTop: "4rem" }}>go back</a>
          </ServicesSection>
        </>
      );
    }

    function ProjectsPage({ data }) {
      return (
        <section className="section">
          <div className="wrap">
            <SectionTitle title="my projects" />
            {data.projects.map(p => <ProjectCard key={p.title} project={p} />)}
            <a href="#/" className="btn center">Go back</a>
          </div>
        </section>
      );
    }

    function BlogListPage({ data }) {
      return (
        <section className="section bg-pattern">
          <div className="wrap">
            <SectionTitle title="blog" />
            <BlogGrid posts={data.blogs} showIds />
            <a href="#/" className="btn center" style={{ marginTop: "4rem" }}>go back</a>
          </div>
        </section>
      );
    }

    function BlogPostPage({ data, slug }) {
      const post = data.blogs.find(b => b.slug === slug);
      if (!post) return <NotFound />;
      const fromExperience = isBackViaHistory("/blogs/" + slug);
      return (
        <section className="section">
          <div className="wrap article">
            <h1>{post.title}</h1>
            <div className="date"><i className="fa-regular fa-calendar"></i>&nbsp; {post.created}</div>
            <Md className="prose" text={post.content} />
            {fromExperience
              ? <button type="button" className="btn center" style={{ marginTop: "4rem" }} onClick={() => window.history.back()}>Go Back</button>
              : <a href={"#/blog#" + post.slug} className="btn center" style={{ marginTop: "4rem" }}>Go Back</a>}
          </div>
        </section>
      );
    }

    function VoyagesPage({ data }) {
      const slides = data.voyages.slides;
      const [idx, setIdx] = useState(0);
      const paused = useRef(false);
      useEffect(() => {
        const t = setInterval(() => { if (!paused.current) setIdx(i => (i + 1) % slides.length); }, 5000);
        return () => clearInterval(t);
      }, [slides.length]);
      const go = d => setIdx((idx + d + slides.length) % slides.length);
      return (
        <section className="section">
          <div className="wrap">
            <SectionTitle title="My sailing voyages" />
            <p className="voyage-intro">{data.voyages.intro}</p>
            <div className="carousel" onMouseEnter={() => paused.current = true} onMouseLeave={() => paused.current = false}>
              <div className="carousel-frame">
                <img src={abs("images/slides/" + slides[idx][0])} alt={slides[idx][1]} />
              </div>
              <div className="carousel-caption">{slides[idx][1]}</div>
              <button className="carousel-btn prev" onClick={() => go(-1)} aria-label="Previous slide"><i className="fa-solid fa-chevron-left"></i></button>
              <button className="carousel-btn next" onClick={() => go(1)} aria-label="Next slide"><i className="fa-solid fa-chevron-right"></i></button>
              <div className="carousel-dots">
                {slides.map((_, i) => (
                  <button key={i} className={i === idx ? "active" : ""} onClick={() => setIdx(i)} aria-label={"Slide " + (i + 1)} />
                ))}
              </div>
            </div>
            <a href="#/blog" className="btn center">my blog</a>
          </div>
        </section>
      );
    }

    function MyBoatPage({ data }) {
      const { myboat } = data;
      const fromExperience = isBackViaHistory("/myboat");
      // the photo enlargements stay out of the navigation history: they are
      // toggled by state (.open), not by hash navigation (:target)
      const [lightbox, setLightbox] = useState(() =>
        ["sailing", "nagelnieuw"].indexOf(location.hash.slice(1)) !== -1 ? location.hash.slice(1) : null);
      const openLb = (e, id) => { e.preventDefault(); setLightbox(id); };
      const closeLb = e => {
        e.preventDefault();
        setLightbox(null);
        if (location.hash) history.replaceState(null, "", location.pathname);
      };
      return (
        <section className="section">
          <div className="wrap split">
              <div className="photo">
                <a href="#sailing" aria-label="Enlarge photo of my boat" onClick={e => openLb(e, "sailing")}>
                  <img src={abs(myboat.image)} alt="My boat" />
                  <span className="photo-zoom"><i className="fa-solid fa-magnifying-glass-plus"></i></span>
                </a>
              </div>
              <div className="content prose">
                <h2>{myboat.title}</h2>
                <Html html={myboat.infoHtml} />
                <ul className="specs">
                  <li>Manufactured: 2008, <a id="nagelnieuw-1" href="#nagelnieuw" onClick={e => openLb(e, "nagelnieuw")}>commissioning at Drimmelen</a></li>
                  <li>Engine: Yanmar 75hp</li>
                  <li>Length / width / height : 13.75m / 4.37m / 20.00m</li>
                  <li>Furling mainsail : 36.9m&sup2; Tape-Drive</li>
                  <li>Genoa 140% : 53m&sup2; Tape-Drive</li>
                  <li>Design: P. Briand / V. Garroni</li>
                  <li>Navigational equipment:
                    <ul>
                      <li>Wind-, depth- and speedometer Raymarine</li>
                      <li>Twin wheel steering, twin compas</li>
                      <li>Raymarine G3 Autopilot</li>
                      <li>VHF radio</li>
                      <li>AIS receiver and NAVTEX</li>
                      <li>BR24 Broadband Radar</li>
                      <li>Simrad NX40 chart plotter</li>
                      <li>Intel NUC + 15.6&quot; USB display (chart/AIS/radar/instruments/compass)</li>
                      <li>Laptop (chart/AIS/radar/instruments/compass)</li>
                      <li>Bow thruster factory-built</li>
                    </ul>
                  </li>
                  <li>4x Victron 130W solar panels and 1x Air X 350W wind generator</li>
                  <li>Webasto diesel central heating system (2 units, 8500W)</li>
                  <li>615L water storage and 40L boiler, 2 toilets/showers (1 converted to storage room)</li>
                  <li>4 unit cooking system (gas) with oven</li>
                  <li>Max. passengers: 13</li>
                  <li>2.3m dinghy + Mercury 2.5hp outboard</li>
                  <li>Max. passengers with sleeping berth: 8</li>
                </ul>
                <h3>Maintenance log</h3>
                <p><a href="https://github.com/JeroenAdam/boat-maintenance-log#2008" target="_blank" rel="noopener noreferrer">external link</a></p>
              </div>
            </div>
          <div className={"lightbox js-lb" + (lightbox === "sailing" ? " open" : "")} id="sailing"><a href="#sailing-1" onClick={closeLb}><span style={{ backgroundImage: "url('/images/sailing04.jpg')" }} /></a></div>
          <div className={"lightbox js-lb" + (lightbox === "nagelnieuw" ? " open" : "")} id="nagelnieuw"><a href="#nagelnieuw-1" onClick={closeLb}><span style={{ backgroundImage: "url('/images/nagelnieuw.jpg')" }} /></a></div>
          <div className="wrap">
            {fromExperience
              ? <button type="button" className="btn center" onClick={() => window.history.back()}>go back</button>
              : <a href="#/" className="btn center">go back</a>}
          </div>
        </section>
      );
    }

    function ContactPage({ data }) {
      return (
        <section className="section">
          <div className="wrap">
            <div className="contact-box">
              <h3>get in touch</h3>
              <p className="lead">Send me a message &mdash; or mail directly to <a href={"mailto:" + data.profile.email}>{data.profile.email}</a>.</p>
              <form action={data.profile.formAction} method="POST">
                <div className="form-group">
                  <input type="text" name="name" placeholder="name" className="form-control" required />
                  <input type="email" name="email" placeholder="email" className="form-control" required />
                  <textarea name="message" rows="6" placeholder="message" className="form-control" required></textarea>
                </div>
                <button type="submit" className="btn center">submit</button>
              </form>
            </div>
          </div>
        </section>
      );
    }

    function VideoPage() {
      return (
        <section className="section">
          <div className="wrap" style={{ textAlign: "center" }}>
            <h2 style={{ marginBottom: "1.5rem" }}>Custom project management tool integrated with RocketChat</h2>
            <video src="/custom-pmtool.mp4" type="video/mp4" width="960" height="530" controls style={{ maxWidth: "100%", borderRadius: "var(--radius)", boxShadow: "var(--card-shadow)" }}></video>
            <a href="#/projects#collaboration-workspace" className="btn center">go back</a>
          </div>
        </section>
      );
    }

    function SimplePage({ title, children, back, backLabel, path }) {
      const fromExperience = path && isBackViaHistory(path);
      return (
        <section className="section" style={{ minHeight: "85vh" }}>
          <div className="wrap article" style={{ textAlign: "center" }}>
            <h2 style={{ marginBottom: "1.2rem" }}>{title}</h2>
            <div className="prose" style={{ textAlign: "left", maxWidth: 640, margin: "0 auto" }}>{children}</div>
            {fromExperience
              ? <button type="button" className="btn center" onClick={() => window.history.back()}>{backLabel || "go back"}</button>
              : <a href={back} className="btn center">{backLabel || "go back"}</a>}
          </div>
        </section>
      );
    }
    const SkillMatrixPage = () => (
      <SimplePage title="SD Skill Matrix" back="#/#experience" path="/skillmatrix">
        <p>A self-help tool I created for Service Desk agents during my 5y. in IT support...</p>
        <p>...to help SD agents develop their skillset managing large IT environments</p>
        <p><a href="https://github.com/JeroenAdam/skillmatrix/blob/master/SD-skill-matrix" target="_blank" rel="noopener noreferrer">https://github.com/...</a></p>
      </SimplePage>
    );
    const BookkeepingPage = () => (
      <SimplePage title="My bookkeeping app" back="#/#self-employed" path="/bookkeeping-app">
        <p>I coded this app (PHP) 20 years ago...</p>
        <p>...to serve as a bookkeeping tool for my business</p>
        <p><a href="https://github.com/JeroenAdam/DIY-bookkeeping-app#my-diy-bookkeeping-app" target="_blank" rel="noopener noreferrer">https://github.com/...</a></p>
      </SimplePage>
    );
    function NotFound() {
      return (
        <div className="not-found">
          <h2>Page not found</h2>
          <p>Sorry, that page doesn&apos;t exist.</p>
          <a href="#/" className="btn">back to home</a>
        </div>
      );
    }

    /* ------------------------------------------------------------ app --- */
    function Header({ data, route, theme, onToggleTheme }) {
      const [open, setOpen] = useState(false);
      const navRef = useRef(null), toggleRef = useRef(null);
      useEffect(() => setOpen(false), [route.path]);
      // a click anywhere outside the open dropdown closes it
      useEffect(() => {
        if (!open) return;
        const onClick = e => {
          if (navRef.current && !navRef.current.contains(e.target) &&
              toggleRef.current && !toggleRef.current.contains(e.target)) setOpen(false);
        };
        document.addEventListener("click", onClick);
        return () => document.removeEventListener("click", onClick);
      }, [open]);
      return (
        <header className="site-header">
          <div className="header-inner">
            <a className="brand" href="#/">
              <strong>{data.profile.name}</strong>
              <small>{data.profile.headline}</small>
            </a>
            <nav ref={navRef} className={"main-nav" + (open ? " open" : "")}>
              <ul>
                {data.navigation.map(l => (
                  <li key={l.id}>
                    <a href={l.url} className={route.path === l.url.slice(1) ? "active" : ""}>
                      <i className={l.icon}></i>{l.text}
                    </a>
                  </li>
                ))}
              </ul>
            </nav>
            <div className="header-actions">
              <button className="theme-toggle" onClick={onToggleTheme}
                      aria-label={theme === "dark" ? "Switch to light mode" : "Switch to dark mode"}
                      title={theme === "dark" ? "Switch to light mode" : "Switch to dark mode"}>
                <i className={theme === "dark" ? "fa-solid fa-sun" : "fa-solid fa-moon"}></i>
              </button>
              <button ref={toggleRef} className="menu-toggle" onClick={() => setOpen(!open)} aria-label="Menu">
                <i className={open ? "fa-solid fa-xmark" : "fa-solid fa-bars"}></i>
              </button>
            </div>
          </div>
        </header>
      );
    }

    function Footer({ data }) {
      return (
        <footer className="site-footer">
          <div className="wrap">
            <h4>Connect with me:</h4>
            <SocialLinks items={data.profile.social} />
          </div>
        </footer>
      );
    }

    function useTheme() {
      const [theme, setTheme] = useState(() => {
        let saved = null;
        try { saved = localStorage.getItem("theme"); } catch (e) {}
        if (saved === "dark" || saved === "light") return saved;
        return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      });
      useEffect(() => {
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.style.colorScheme = theme;
        try { localStorage.setItem("theme", theme); } catch (e) {}
      }, [theme]);
      return [theme, () => setTheme(t => (t === "dark" ? "light" : "dark"))];
    }

    function Router({ data }) {
      const route = useHashRoute();
      const [theme, toggleTheme] = useTheme();
      const prevPath = useRef(route.path);
      // on returning (browser history) from a special-case Experience link, restore
      // the scroll position saved when the link was clicked, so the experience
      // tabs come back into the viewport instead of the top of the page
      useEffect(() => {
        const from = prevPath.current;
        prevPath.current = route.path;
        let y = null;
        try {
          const marked = sessionStorage.getItem("backViaHistory");
          if (marked && from === marked && isHistoryNav() && (route.path === "/" || route.path === "/about")) {
            const v = sessionStorage.getItem("backScroll");
            if (v !== null) y = parseInt(v, 10);
            sessionStorage.removeItem("backScroll");
          }
        } catch (e) {}
        if (y !== null && !isNaN(y)) restoreScroll(y);
        else scrollToTarget(route.frag);
        // canonical URL: the clean path form ("/blogs/foo", "/blog#frag"),
        // never "/#/" — replaceState keeps history and scroll untouched
        const canon = route.path + (route.frag ? "#" + route.frag : "");
        const cur = window.location.pathname + window.location.hash;
        if (cur !== canon) window.history.replaceState(null, "", canon);
      }, [route.path, route.frag]);
      // the "came from the jobs section" mark only applies while on that exact
      // route: any other navigation clears it
      useEffect(() => {
        try {
          const marked = sessionStorage.getItem("backViaHistory");
          if (marked && marked !== route.path) sessionStorage.removeItem("backViaHistory");
        } catch (e) {}
      }, [route.path]);

      useEffect(() => {
        const base = "Jeroen Adam";
        const names = { "/": "IT Generalist, Web Developer | author of Talim.app", "/about": "About Me",
          "/projects": "Projects", "/blog": "Blog", "/myvoyages": "My sailing voyages", "/myboat": "My Boat",
          "/contact": "Contact", "/video": "Video demo", "/skillmatrix": "SD Skill Matrix", "/bookkeeping-app": "Bookkeeping app" };
        if (route.path.startsWith("/blogs/")) {
          const post = data.blogs.find(b => b.slug === route.path.slice(7));
          document.title = post ? post.title + " | " + base : base;
        } else {
          document.title = names[route.path] ? names[route.path] + " | " + base : base;
        }
      }, [route.path, data]);

      let page;
      if (route.path === "/") page = <HomePage data={data} />;
      else if (route.path === "/about") page = <AboutPage data={data} />;
      else if (route.path === "/projects") page = <ProjectsPage data={data} />;
      else if (route.path === "/blog") page = <BlogListPage data={data} />;
      else if (route.path.startsWith("/blogs/")) page = <BlogPostPage data={data} slug={route.path.slice(7)} />;
      else if (route.path === "/myvoyages") page = <VoyagesPage data={data} />;
      else if (route.path === "/myboat") page = <MyBoatPage data={data} />;
      else if (route.path === "/contact") page = <ContactPage data={data} />;
      else if (route.path === "/video") page = <VideoPage />;
      else if (route.path === "/skillmatrix") page = <SkillMatrixPage />;
      else if (route.path === "/bookkeeping-app") page = <BookkeepingPage />;
      else page = <NotFound />;

      return (
        <>
          <Header data={data} route={route} theme={theme} onToggleTheme={toggleTheme} />
          <main>{page}</main>
          <Footer data={data} />
          <ScrollToTopButton />
        </>
      );
    }

    function Root() {
      const [data, setData] = useState(null);
      const [error, setError] = useState(null);
      useEffect(() => {
        fetch("/data.json")
          .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
          .then(setData)
          .catch(e => setError(String(e.message || e)));
      }, []);
      if (error) {
        return (
          <div className="fatal wrap">
            <h2>Could not load data.json</h2>
            <p>{error}</p>
            <p>Browsers block <code>fetch()</code> on <code>file://</code> pages. Serve the folder locally, e.g.
              run <code>python -m http.server 8080</code> in this folder and open
              <a href="http://localhost:8080"> http://localhost:8080</a>.</p>
          </div>
        );
      }
      if (!data) return <div className="loading"><i className="fa-solid fa-compass"></i><p>Loading&hellip;</p></div>;
      return <Router data={data} />;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
  </script>
</body>
</html>
